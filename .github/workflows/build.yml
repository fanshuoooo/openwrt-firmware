name: Build ImmortalWrt Firmware

on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo apt-get clean
          df -hT

      - name: Build firmware
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ImmortalWrt_CR6608_firmware
          path: |
            immortalwrt/bin/targets/*/*/*.bin
            immortalwrt/bin/targets/*/*/*.map

      - name: Upload build log on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: |
            immortalwrt/.config
            immortalwrt/logs/
